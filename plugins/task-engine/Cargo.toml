[package]
name = "task_engine"
version = "0.1.0"
edition = "2021"
description = "Portable workstation task & activity ML funnel engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
core-foundation = "0.10"
core-graphics = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11 = "2"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
