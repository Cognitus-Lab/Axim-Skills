<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXIM Scan — Security & Bug Detection</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2e;
      --border: #232d45;
      --text: #f0f4fc;
      --text-muted: #8c9bb5;
      --primary: #3b82f6;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    header {
      width: 100%;
      max-width: 900px;
      padding: 32px 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-sizing: border-box;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: rgba(59, 130, 246, 0.15);
      color: var(--primary);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    main {
      width: 100%;
      max-width: 900px;
      padding: 0 20px 40px;
      box-sizing: border-box;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }
    textarea {
      width: 100%;
      height: 220px;
      background: #0d1220;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #e2e8f0;
      font-family: "JetBrains Mono", Menlo, Consolas, Monaco, monospace;
      font-size: 13px;
      padding: 12px;
      box-sizing: border-box;
      resize: vertical;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }
    select {
      background: #0d1220;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    .results {
      margin-top: 24px;
    }
    .finding {
      background: #0d1220;
      border-left: 4px solid var(--danger);
      padding: 16px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 12px;
    }
    .finding.warning {
      border-left-color: var(--warning);
    }
    .finding-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .finding-title {
      font-weight: 600;
      font-size: 15px;
    }
    .finding-cwe {
      color: var(--text-muted);
      font-size: 12px;
    }
    pre {
      background: #070a12;
      padding: 10px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🛡️ AXIM Scan <span class="badge">Cognitus</span></h1>
    <span style="color: var(--text-muted); font-size: 13px;">Enterprise Code Security</span>
  </header>
  <main>
    <div class="card">
      <label for="code">Source Code to Scan:</label>
      <textarea id="code" placeholder="Paste source code (Python, JS/TS, Go, Swift, Java, C/C++) to audit for security flaws and bugs..."></textarea>
      <div class="controls">
        <select id="language">
          <option value="python">Python</option>
          <option value="javascript">JavaScript / TypeScript</option>
          <option value="go">Go</option>
          <option value="swift">Swift</option>
          <option value="java">Java</option>
          <option value="c">C / C++</option>
          <option value="shell">Shell script</option>
        </select>
        <button id="scanBtn" onclick="runScan()">Scan Code</button>
      </div>
    </div>
    <div id="output" class="results"></div>
  </main>
  <script>
    async function runScan() {
      const code = document.getElementById('code').value;
      const language = document.getElementById('language').value;
      const btn = document.getElementById('scanBtn');
      const output = document.getElementById('output');

      if (!code.trim()) {
        alert('Please enter or paste code to scan.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Scanning...';
      output.innerHTML = '';

      try {
        const res = await fetch('/api/scan', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ code, language, format: 'json' })
        });
        const data = await res.json();
        btn.disabled = false;
        btn.textContent = 'Scan Code';

        if (!data.findings || data.findings.length === 0) {
          output.innerHTML = '<div class="card" style="border-color: var(--success);"><h3 style="color: var(--success); margin: 0;">✅ Zero Vulnerabilities Detected</h3><p style="color: var(--text-muted); margin: 8px 0 0;">No security flaws, bugs, or hardcoded credentials found.</p></div>';
          return;
        }

        let html = `<h3>Found ${data.findings.length} Security Issue(s)</h3>`;
        data.findings.forEach(f => {
          const isErr = f.severity === 'ERROR';
          html += `
            <div class="finding ${isErr ? '' : 'warning'}">
              <div class="finding-header">
                <span class="finding-title">${f.name} (${f.severity})</span>
                <span class="finding-cwe">${f.cwe}</span>
              </div>
              <p style="margin: 6px 0; font-size: 13px;">${f.message}</p>
              <pre><code>${f.snippet}</code></pre>
              <p style="margin: 6px 0 0; font-size: 13px; color: var(--primary);"><strong>Fix:</strong> ${f.fix}</p>
            </div>
          `;
        });
        output.innerHTML = html;
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Scan Code';
        output.innerHTML = `<div class="card" style="border-color: var(--danger); color: var(--danger);">Error: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
